<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 236" width="920" height="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .ink { fill: #141413; } .muted { fill: #6b6a65; } .clay { fill: #a94524; } .tick { stroke: #a94524; }
    .box { fill: #fdfdfc; stroke: #a94524; stroke-width: 1.6; }
    .plain { fill: #fdfdfc; stroke: #8d8b84; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .arrow { stroke: #4d4c48; stroke-width: 1.6; fill: none; }
    .head { fill: #4d4c48; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .ink { fill: #f0efe9; } .muted { fill: #9d9b94; } .clay { fill: #e2784f; } .tick { stroke: #e2784f; }
      .box { fill: #161b22; stroke: #e2784f; } .plain { fill: #161b22; stroke: #6e6c66; }
      .arrow { stroke: #b9b7ae; } .head { fill: #b9b7ae; }
    }
    .t { font-size: 16px; font-weight: 600; }
    .s { font-size: 13.5px; }
    .l { font-size: 12.5px; }
  </style>
  <rect class="bg" x="0" y="0" width="920" height="236" rx="12"/>

  <path class="tick" d="M24 34 l6 6 l12 -13" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="s ink" x="52" y="39">Lean checks every proof, for every possible input</text>

  <rect class="box" x="20" y="56" width="236" height="112" rx="10"/>
  <text class="t ink" x="38" y="86">Lean 4 source</text>
  <text class="s muted" x="38" y="109">version order, “am I affected?”,</text>
  <text class="s muted" x="38" y="128">privacy filter, URL encoding</text>
  <text class="s clay" x="38" y="153">+ 19 theorems about them</text>

  <path class="arrow" d="M256 112 H 324"/><path class="head" d="M324 106 l10 6 l-10 6 z"/>
  <text class="l muted" x="294" y="100" text-anchor="middle">compiled</text>

  <rect class="box" x="346" y="56" width="188" height="112" rx="10"/>
  <text class="t ink" x="364" y="86">C code</text>
  <text class="s muted" x="364" y="109">generated by Lean from</text>
  <text class="s muted" x="364" y="128">the same definitions</text>

  <path class="arrow" d="M534 112 H 574"/><path class="head" d="M574 106 l10 6 l-10 6 z"/>
  <text class="l muted" x="557" y="100" text-anchor="middle">linked</text>

  <rect class="plain" x="596" y="56" width="140" height="112" rx="10"/>
  <text class="t ink" x="614" y="86">C bridge</text>
  <text class="s muted" x="614" y="109">~80 lines,</text>
  <text class="s muted" x="614" y="128">bytes in and out</text>

  <path class="arrow" d="M736 112 H 772"/><path class="head" d="M772 106 l10 6 l-10 6 z"/>

  <rect class="plain" x="784" y="56" width="120" height="112" rx="10"/>
  <text class="t ink" x="802" y="86">The app</text>
  <text class="s muted" x="802" y="109">Swift: scans,</text>
  <text class="s muted" x="802" y="128">network, UI</text>

  <rect class="box" x="20" y="196" width="26" height="16" rx="4"/>
  <text class="s ink" x="56" y="209">proved: the code that runs is the code the theorems are about</text>
  <rect class="plain" x="596" y="196" width="26" height="16" rx="4"/>
  <text class="s ink" x="632" y="209">tested, not proved</text>
</svg>
