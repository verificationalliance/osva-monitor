name: osva-verify

# Re-checks the Lean core's claimed theorems (listed in .verificationalliance.json) with the
# Verification Alliance's workflow, and has GitHub sign the result for the commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: verificationalliance/verify/.github/workflows/lean.yml@9ade54f5ae013edfab689dd7c2b763ee5b6e0ab9 # workflow-5
    permissions:
      contents: read
      id-token: write
      attestations: write
