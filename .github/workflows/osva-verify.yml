name: osva-verify

# Re-checks the Lean core's claimed theorems (listed in .verificationalliance.json) with the
# Verification Alliance's workflow, and has GitHub sign the result for the commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: verificationalliance/verify/.github/workflows/lean.yml@6512d67903dd322b2d3ff7b9563fb740f2518243 # workflow-6
    permissions:
      contents: read
      id-token: write
      attestations: write
