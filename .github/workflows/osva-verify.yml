name: osva-verify

# Re-checks the Lean core's claimed theorems (listed in .verificationalliance.json) with the
# Verification Alliance's workflow, and has GitHub sign the result for the commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: verificationalliance/verify/.github/workflows/lean.yml@7896c828bcbf92207bb4baa0829a04a2760ece30 # workflow-3
    permissions:
      contents: read
      id-token: write
      attestations: write
