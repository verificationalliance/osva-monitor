name: osva-verify

# Re-checks the Lean core's claimed theorems (listed in .verificationalliance.json) with the
# Verification Alliance's workflow, and has GitHub sign the result for the commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: verificationalliance/verify/.github/workflows/lean.yml@6fdf9a0870d09204e776d2fc357d96acb3258eb8 # workflow-10
    permissions:
      contents: read
      id-token: write
      attestations: write
